name: Check standalone game
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Install browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:shell
      - run: npm run test:visuals
      - run: npm run test:experience
      - run: npm run test:development
      - run: npm run test:adventure
      - run: npm run test:modes
      - name: Preserve visual review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legends-browser-captures
          path: artifacts/*.png
          retention-days: 7
          if-no-files-found: ignore
