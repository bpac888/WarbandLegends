name: Check standalone game
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Install browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:shell
      - run: npm run test:visuals
      - run: npm run test:experience
      - run: npm run test:development
      - run: npm run test:adventure
      - run: npm run test:modes
      - run: npm run test:tactics
      - run: npm run test:economy
      - run: npm run test:refresh
      - run: npm run test:viewport
      - run: npm run test:ascension
      - run: npm run test:covenant
      - run: npm run test:lifecycle
      - run: npm run test:combat-feel
      # Keep diagnostic images only for failed checks; storage limits must not mask test results.
      - name: Preserve failed-check visual captures
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: legends-browser-captures
          path: artifacts/*.png
          retention-days: 3
          if-no-files-found: ignore
